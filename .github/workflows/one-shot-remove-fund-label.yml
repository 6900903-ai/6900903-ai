name: One-shot remove fund label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-fund-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove only the visible Russian fund label
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'ФОНД ЧЕСТНЫЙ ПОЛИТЗЕК • '
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 matching marquee prefixes, found {count}')
          p.write_text(s.replace(old, ''), encoding='utf-8')
      - name: Commit the minimal change and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-remove-fund-label.yml
          git add index.html
          git commit -m "Remove fund label from hero marquee"
          git push
