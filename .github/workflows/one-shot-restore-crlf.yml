name: One-shot restore original line endings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-restore-crlf.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore CRLF without changing page content
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_bytes().decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
          p.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
      - name: Commit line-ending restoration and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-restore-crlf.yml
          git add index.html
          git commit -m "Restore original CRLF line endings"
          git push
